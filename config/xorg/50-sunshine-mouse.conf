# Sunshine 远程桌面的虚拟鼠标关闭加速 (flat)
# Windows 端已经做过一次鼠标加速, Linux 再加速一次会导致光标飘移、不跟手
# 由 setup.sh deps 复制到 /etc/X11/xorg.conf.d/, 重启 X 后生效
Section "InputClass"
    Identifier   "sunshine virtual mouse: flat acceleration"
    MatchProduct "libvirtualhid Mouse"
    Option       "AccelProfile" "flat"
EndSection
