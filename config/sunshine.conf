# Sunshine 串流服务配置 (~/.config/sunshine/sunshine.conf 软链接到这里)
# 完整选项: https://docs.lizardbyte.dev/projects/sunshine/latest/md_docs_2configuration.html
# 注意: 在网页控制台 (https://localhost:47990) 里改的设置也会写回这个文件

# 抓屏方式: KMS 直接从显卡取画面交给编码器 (零拷贝, CPU 占用低, 鼠标更跟手)
# 需要 sunshine 程序带 cap_sys_admin 权限 (sunshine-bin 安装时已设置); 不可用时改回 capture = x11
capture = kms

# 硬件编码: Intel 核显 VAAPI (省电); 效果不好可改为 encoder = nvenc 使用 RTX 4070
# BIOS 切到独显直连 (无核显) 时, bin/sunshine.sh 启动时自动改用 capture=x11 + encoder=nvenc, adapter_name 也由脚本自动探测
encoder = vaapi
adapter_name = /dev/dri/renderD128

# 网页控制台只允许局域网访问
origin_web_ui_allowed = lan

# 远程时 Alt 当作 Super 操作 dwm: 由 bin/sunshine.sh 对虚拟键盘设置 altwin:swap_alt_win 实现
# (不要再开 key_rightalt_to_key_win, 否则右 Alt 转成 Win 后又被互换回 Alt)
