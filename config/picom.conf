# 基础设置
backend = "glx";
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-client-opacity = true;
unredir-if-possible = true;
vsync = true;
dbe = false;
detect-transient = true;
detect-client-leader = true;
invert-color-include = [ ];
glx-copy-from-front = false;

# 圆角
corner-radius = 10.0;
round-borders = 2;
rounded-corners-exclude = [
    "_DWM_GLOBAL@:c = 1",    # 全局窗口 (super g) 显示为直角, 与普通窗口区分
    # "class_g *= 'dwm'",
    "class_g *= 'fcitx'",
];

# 阴影: 只给选中窗口加一圈白色光晕 (未选中窗口靠 inactive-dim 略微变暗)
shadow = true;
detect-rounded-corners = false;
shadow-color = "#ffffff";
shadow-radius = 16;
shadow-offset-x = -16;       # 偏移取 -radius, 光晕四周均匀
shadow-offset-y = -16;
shadow-opacity = 0.35;
shadow-ignore-shaped = false;
shadow-exclude = [
	"!focused",
	"_NET_WM_STATE@:32a *= '_NET_WM_STATE_HIDDEN'",
	"_GTK_FRAME_EXTENTS@:c",
	"override_redirect = 1 && !WM_CLASS@:s",
    "name = 'Notification'",
    "class_g ?= 'Dmenu'",
    "class_g *= 'dwm'",
    "class_g *= 'Wine'",
    "name = 'Dunst'",
    "class_g *= 'float'"
];

# 透明
active-opacity = 0.95;
inactive-dim = 0.1;          # 未选中窗口略微变暗, 衬托选中窗口
opacity-rule = [
    "100:_NET_WM_STATE@:32a *= '_NET_WM_STATE_STICKY'", # 画中画
    "100:_NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN' && WM_CLASS@:s *= 'google-chrome'", # 全屏 chrome 窗口
    "100:WM_NAME@:s = '画中画'",
    "100:WM_CLASS@:s *= 'vncviewer'",
    "100:class_g = 'mpv'",
    "100:class_g = 'obs'",
    "100:class_g = 'Gimp'",
    # "90:WM_CLASS@:s *= 'google-chrome' && !focused",
    "92:!focused",
];

# 淡入淡出
fading = true;
fade-delta = 2;
fade-in-step = 0.01;
fade-out-step = 0.01;
fade-exclude = [
    "class_g *= 'fcitx'",
    "class_g = 'Rofi'",
    "WM_CLASS@:s *= 'screenkey'",
];

# 动画
animations = true;
animation-window-mass = 0.5;
animation-dampening = 16;
animation-stiffness-in-tag = 125;
animation-for-open-window = "zoom";
animation-for-unmap-window = "squeeze";
animation-exclude = [
    "class_g = 'fcitx'",
    "class_g = 'flameshot'",
    "class_g = 'Dunst'",
    "class_g = 'Rofi'",
    "WM_CLASS@:s *= 'screenkey'",
    "_NET_WM_NAME@:s *= 'wechat'",
];

# 模糊
blur-method = "dual_kawase";
blur-strength = 4;
blur-kern = "3x3box";
blur-background-exclude = [
    # "class_g *= 'dwm'",
    "class_g = 'fcitx'",
	"window_type = 'dock'",
	"window_type = 'desktop'",
	"_GTK_FRAME_EXTENTS@:c",
    "class_g *= 'wemeetapp'",
    "_NET_WM_NAME@:s *= 'wechat'",
];

# 针对窗口类型的设置
wintypes :
{
  tooltip: { fade = true; shadow = false; opacity = 0.85; focus = true; };
  fullscreen: { fade = true; shadow = false; focus = true; opacity = 0.93; };
};
