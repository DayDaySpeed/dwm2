# picom v13 配置 (源码在 picom/, 带 dwm2 的 _DWM_NOANIM 补丁, 装在 ~/.local/bin/picom)
# 窗口相关的设置都写在下面的 rules 里: v13 用了 rules 之后, 旧的 *-exclude / opacity-rule / wintypes 等选项都不再生效

# 基础设置
backend = "glx";
vsync = true;
detect-transient = true;
detect-client-leader = true;
detect-client-opacity = true;
unredir-if-possible = true;

# 圆角
corner-radius = 10;

# 阴影: 只给选中窗口加一圈白色光晕 (未选中窗口靠 dim 略微变暗)
shadow = true;
shadow-color = "#ffffff";
shadow-radius = 16;
shadow-offset-x = -16;       # 偏移取 -radius, 光晕四周均匀
shadow-offset-y = -16;
shadow-opacity = 0.15;       # 光晕调淡: 选中窗口已有白色边框, 光晕只做点缀

# 淡入淡出 (透明度变化时; 打开 / 关闭由下面的动画负责)
fading = true;
fade-delta = 2;
fade-in-step = 0.01;
fade-out-step = 0.01;

# 模糊
blur-method = "dual_kawase";
blur-strength = 3;           # 4 -> 3: 观感差别不大, 240Hz 下明显省 GPU
blur-background = true;

# 动画: 打开 / 显示从中心放大, 关闭 / 隐藏缩小淡出, 位置和大小变化平滑过渡
# (切 tag 时 dwm 把其他 tag 的窗口藏在屏幕左右两侧, 新 tag 的窗口从一侧滑进来, 旧的从另一侧滑出;
#  Super+Z 星系 / Super+A 总览交接时 dwm 设置 _DWM_NOANIM, 这段时间不做动画)
# 位置 / 大小的曲线拟合旧 picom 分支的弹簧 (mass 0.5, stiffness 125, dampening 16: 临界阻尼, 约 0.3s 走完 95%),
# 误差 < 2%; 不用 geometry-change 预设: 它起步太急 (0.2s 内几乎瞬移) 还会混合新旧两张画面, 切 tag 时看着像闪
animations = (
    { triggers = [ "open", "show" ]; preset = "appear"; scale = 0.6; duration = 0.2; },
    { triggers = [ "close", "hide" ]; preset = "disappear"; scale = 0.6; duration = 0.15; },
    { triggers = [ "geometry" ];
      offset-x = { curve = "cubic-bezier(0.2, 0.1, 0.2, 1)"; duration = 0.42; start = "window-x-before - window-x"; end = 0; };
      offset-y = { curve = "cubic-bezier(0.2, 0.1, 0.2, 1)"; duration = 0.42; start = "window-y-before - window-y"; end = 0; };
      scale-x = { curve = "cubic-bezier(0.2, 0.1, 0.2, 1)"; duration = 0.42; start = "window-width-before / window-width"; end = 1; };
      scale-y = { curve = "cubic-bezier(0.2, 0.1, 0.2, 1)"; duration = 0.42; start = "window-height-before / window-height"; end = 1; };
      shadow-offset-x = "offset-x";
      shadow-offset-y = "offset-y";
      shadow-scale-x = "scale-x";
      shadow-scale-y = "scale-y"; }
);

rules = (
    # 透明: 选中的窗口 95% (override-redirect 窗口和没有 WM 边框的窗口按选中算), 未选中 92% 并略微变暗
    { match = "focused || wmwin || override_redirect"; opacity = 0.95; },
    { match = "!(focused || wmwin || override_redirect)"; opacity = 0.92; dim = 0.1; },
    { match = "window_type = 'tooltip'"; opacity = 0.85; shadow = false; },
    { match = "fullscreen"; opacity = 0.93; shadow = false; corner-radius = 0; },

    # 阴影只给选中窗口
    { match = "!focused"; shadow = false; },
    { match = "_NET_WM_STATE@ *= '_NET_WM_STATE_HIDDEN' || _GTK_FRAME_EXTENTS@"
            " || (override_redirect = 1 && !WM_CLASS@) || name = 'Notification' || name = 'Dunst'"
            " || class_g ?= 'Dmenu' || class_g *= 'dwm' || class_g *= 'Wine' || class_g *= 'float'"; shadow = false; },

    # 以文字为主的窗口不透明 (选中和未选中都是), 避免文字下透出壁纸, 看久了累眼; 浮动终端 / scratchpad 仍保留透明
    { match = "class_g *= 'Code'"              # VS Code (新版 class 为 com.microsoft.VSCode)
            " || class_g = 'cursor'"           # Cursor
            " || class_g = 'Google-chrome' || class_g = 'Microsoft-edge' || class_g = 'Typora'"
            " || class_g = 'tabbed'";          # 平铺的 st 终端 (Super+Enter)
      opacity = 1; },
    { match = "_NET_WM_STATE@ *= '_NET_WM_STATE_STICKY' || WM_NAME@ = '画中画'"     # 画中画
            " || (_NET_WM_STATE@ *= '_NET_WM_STATE_FULLSCREEN' && WM_CLASS@ *= 'google-chrome')"
            " || WM_CLASS@ *= 'vncviewer' || class_g = 'mpv' || class_g = 'obs' || class_g = 'Gimp'";
      opacity = 1; },

    # 不加圆角: 输入法候选框; Cursor (圆角合成会让 Electron 在打开窗口时崩)
    { match = "class_g *= 'fcitx' || class_g = 'cursor'"; corner-radius = 0; },

    # 不做模糊: 透明背景的小部件和会议 / 聊天软件
    { match = "class_g = 'dwm-badge'"   # dwm 全局窗口的图钉徽章 (透明背景, 不模糊其后的窗口内容)
            " || class_g = 'fcitx' || window_type = 'dock' || _GTK_FRAME_EXTENTS@"
            " || class_g *= 'wemeetapp' || _NET_WM_NAME@ *= 'wechat'";
      blur-background = false; },

    # 不淡入淡出
    { match = "class_g *= 'fcitx' || class_g = 'Rofi' || class_g = 'cursor' || WM_CLASS@ *= 'screenkey'"; fade = false; },

    # 不加动画: 输入法、截图、通知、菜单、按键显示、微信; Cursor (打开时连续改窗口大小, Electron 主进程会崩)
    { match = "class_g = 'fcitx' || class_g = 'flameshot' || class_g = 'Dunst' || class_g = 'Rofi'"
            " || class_g = 'cursor' || WM_CLASS@ *= 'screenkey' || _NET_WM_NAME@ *= 'wechat'";
      animations = ({ triggers = [ "open", "close", "show", "hide", "geometry" ]; }); },

    # 动态壁纸 (bin/livewall.sh, desktop 类型)、场景壁纸、壁纸转场 (bin/transition.py):
    # 不透明、无阴影圆角模糊动画、不淡入淡出 (转场播完立即消失, 露出底下的新壁纸), 不触发 unredirect
    { match = "window_type = 'desktop' || class_g = 'linux-wallpaperengine' || class_g = 'livewall-transition'";
      opacity = 1; shadow = false; corner-radius = 0; blur-background = false; fade = false; unredir = false;
      animations = ({ triggers = [ "open", "close", "show", "hide", "geometry" ]; }); },

    # Super+Z 星系 / Super+A 总览的全屏遮罩: 始终 100% 不透明, 不加阴影、圆角、模糊、淡入淡出和动画,
    # 也不因为它全屏而停止合成; 否则会出现黑边、二次淡入和闪烁
    { match = "class_g = 'dwm-galaxy' || class_g = 'dwm-overview'";
      opacity = 1; shadow = false; corner-radius = 0; blur-background = false; fade = false; unredir = false;
      animations = ({ triggers = [ "open", "close", "show", "hide", "geometry" ]; }); },
);
